name: Deploy Base Infrastructure

on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'terraform/**'
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'terraform/**'
      - 'src/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      destroy:
        description: 'Destroy infrastructure'
        required: false
        default: false
        type: boolean
      force_apply:
        description: 'Force terraform apply even if no changes detected'
        required: false
        default: false
        type: boolean

jobs:
  determine-environment:
    name: 'Determine Environment'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      regions: ${{ steps.env.outputs.regions }}
    steps:
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            ENV="staging"
          else
            echo "⚠️ Unknown branch: ${{ github.ref }} - defaulting to staging" >> $GITHUB_STEP_SUMMARY
            ENV="staging"
          fi
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          if [ "${ENV}" == "staging" ]; then
            echo 'regions=["us-east-2"]' >> $GITHUB_OUTPUT
          else
            echo 'regions=["eu-central-1","eu-west-2","eu-west-3"]' >> $GITHUB_OUTPUT
          fi

  python-security:
    name: 'Python Security (SAST / SCA / Secrets)'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit semgrep pip-audit

      - name: Bandit (SAST)
        run: |
          echo "🔍 Running Bandit on src/..."
          bandit -r src -f screen --severity-level medium -x src/deprecated || true
        continue-on-error: true

      - name: Semgrep (Python SAST)
        run: |
          echo "🔍 Running Semgrep Python rules..."
          semgrep scan --config=p/python --config=p/security-audit --error --no-git-ignore src 2>/dev/null || \
          semgrep scan --config=auto --error --no-git-ignore src 2>/dev/null || true
        continue-on-error: true

      - name: pip-audit (SCA)
        run: |
          echo "🔍 Scanning dependencies for known vulnerabilities..."
          REQ_FILES=$(find src -name "requirements.txt" -type f 2>/dev/null || true)
          if [ -z "$REQ_FILES" ]; then
            echo "✅ No requirements.txt in src. Skipping pip-audit."
            exit 0
          fi
          FAILED=0
          for req in ${REQ_FILES}; do
            echo "--- $req ---"
            pip-audit -r "$req" || FAILED=1
          done
          if [ $FAILED -eq 1 ]; then
            echo "❌ One or more requirements.txt have known vulnerabilities. Fix with pip-audit and update pins."
            exit 1
          fi
          echo "✅ No known vulnerabilities in scanned requirements."


      - name: Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  terraform-validate-and-scan:
    name: 'Terraform Validate & Scan'
    needs: [determine-environment, python-security]
    runs-on: ubuntu-latest
    outputs:
      validation_passed: ${{ steps.validate.outputs.passed }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
      - name: Terraform Init
        id: init
        run: |
          REGIONS='${{ needs.determine-environment.outputs.regions }}'
          FIRST_REGION=$(echo $REGIONS | jq -r '.[0]')
          if [ "$FIRST_REGION" != "null" ] && [ -n "$FIRST_REGION" ]; then
            BACKEND_CONFIG="${{ needs.determine-environment.outputs.environment }}-${FIRST_REGION}.tfbackend"
          else
            BACKEND_CONFIG="${{ needs.determine-environment.outputs.environment }}.tfbackend"
          fi
          terraform init -backend-config="backend-configs/${BACKEND_CONFIG}"
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform
      - name: TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - name: TFLint Analysis
        run: |
          tflint --init
          tflint --format compact
        working-directory: terraform
      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: terraform
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          tf-vars: terraform/environments/${{ needs.determine-environment.outputs.environment }}.auto.tfvars
          trivyignores: terraform/.trivyignore
        continue-on-error: true
      - name: Pass validation
        id: validate
        run: echo "passed=true" >> $GITHUB_OUTPUT

  check-lambda-layer:
    name: 'Check Lambda Layer'
    needs: [determine-environment, python-security, terraform-validate-and-scan]
    runs-on: ubuntu-latest
    outputs:
      has_lambda_layer: ${{ steps.check.outputs.has_lambda_layer }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for lambda layer
        id: check
        run: |
          if [ -d "terraform/modules/lambda-layer" ] && [ -n "$(find terraform/modules/lambda-layer -type f 2>/dev/null)" ]; then
            echo "has_lambda_layer=true" >> $GITHUB_OUTPUT
          else
            echo "has_lambda_layer=false" >> $GITHUB_OUTPUT
          fi

  build-lambda-layers:
    name: 'Build Lambda Layers'
    needs: [determine-environment, python-security, check-lambda-layer]
    if: needs.check-lambda-layer.outputs.has_lambda_layer == 'true'
    runs-on: ubuntu-latest
    outputs:
      layers-built: ${{ steps.build.outputs.layers-built }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate Python Syntax (Recursive)
        run: |
          echo "🔍 Validating Python syntax for all files in src/..."
          
          PYTHON_FILES=$(find src -name "*.py" -type f 2>/dev/null || true)
          
          if [ -z "$PYTHON_FILES" ]; then
            echo "⚠️ No Python files found in src"
            exit 0
          fi
          
          # Count files
          FILE_COUNT=$(echo "$PYTHON_FILES" | wc -l)
          echo "📊 Found $FILE_COUNT Python file(s) to validate"
          
          # Final validation - compile all files and capture errors
          FAILED=0
          ERROR_FILES=()
          for file in $(find src -name "*.py" -type f 2>/dev/null); do
            if ! python -m py_compile "$file" 2>&1 >/dev/null; then
              ERROR_OUTPUT=$(python -m py_compile "$file" 2>&1)
              echo "❌ Syntax error in: $file"
              echo "$ERROR_OUTPUT"
              ERROR_FILES+=("$file")
              FAILED=1
            fi
          done
          
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ Python syntax validation failed!"
            echo "Files with errors: ${#ERROR_FILES[@]}"
            echo "Please fix all syntax errors before proceeding."
            exit 1
          fi
          
          echo "✅ All $FILE_COUNT Python files passed syntax validation!"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Build Lambda Layers
        id: build
        run: |
          cd terraform/modules/lambda-layer
          
          echo "🔧 Building Lambda Layers for environment: ${{ needs.determine-environment.outputs.environment }}"
          
          # Make build scripts executable
          chmod +x build-layer.sh
          
          # Extract layer names from main.tf
          echo "🔍 Discovering layers defined in main.tf..."
          LAYERS_TO_BUILD=()
          
          # Look for layer_name_suffix in main.tf
          while IFS= read -r line; do
            if [[ $line =~ layer_name_suffix.*=.*\"([^\"]+)\" ]]; then
              layer_name="${BASH_REMATCH[1]}"
              LAYERS_TO_BUILD+=("$layer_name")
              echo "📦 Found layer: $layer_name"
            fi
          done < ../../main.tf
          
          if [ ${#LAYERS_TO_BUILD[@]} -eq 0 ]; then
            echo "❌ No layers found in main.tf"
            exit 1
          fi
          
          echo "🎯 Building layers: ${LAYERS_TO_BUILD[*]}"
          
          # Build each discovered layer
          for layer in "${LAYERS_TO_BUILD[@]}"; do
            echo "🔨 Building layer: $layer"
            ./build-layer.sh "$layer"
          done
          
          # Verify built layers
          echo "🔍 Verifying built layers..."
          layer_count=0
          for layer_file in layer-*.zip; do
            if [ -f "$layer_file" ]; then
              size=$(du -h "$layer_file" | cut -f1)
              echo "✅ $layer_file found (${size})"
              layer_count=$((layer_count + 1))
            fi
          done
          
          if [ $layer_count -eq 0 ]; then
            echo "❌ No layer files found"
            exit 1
          fi
          
          echo "✅ Successfully built $layer_count Lambda layer artifacts"
          echo "layers-built=true" >> $GITHUB_OUTPUT

      - name: Upload Lambda Layer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-layers-${{ needs.determine-environment.outputs.environment }}
          path: terraform/modules/lambda-layer/layer-*.zip
          retention-days: 7

  deploy-base-infrastructure:
    name: Deploy ${{ matrix.region }}
    needs: [determine-environment, build-lambda-layers, check-lambda-layer]
    if: always() && (needs.build-lambda-layers.result == 'success' || needs.build-lambda-layers.result == 'skipped') && needs.check-lambda-layer.result == 'success' && needs.terraform-validate-and-scan.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.determine-environment.outputs.regions) }}
    uses: thriambakg/RDI-Pipelines/.github/workflows/terraform-reusable.yml@main
    with:
      terraform_directory: 'terraform'
      infrastructure_type: 'base'
      environment: ${{ needs.determine-environment.outputs.environment }}
      region: ${{ matrix.region }}
      destroy: ${{ github.event.inputs.destroy == 'true' }}
      force_apply: ${{ github.event.inputs.force_apply == 'true' }}
      base_infra_dependency: false
      has_lambda_layer: false
      skip_validation: true
      skip_deployment_summary: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  deployment-summary:
    name: 'Deployment Summary'
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy-base-infrastructure]
    if: always() && (needs.deploy-base-infrastructure.result == 'success' || needs.deploy-base-infrastructure.result == 'failure')
    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 Base Infrastructure Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.determine-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Regions:** ${{ needs.determine-environment.outputs.regions }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ needs.deploy-base-infrastructure.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review the per-region jobs above for detailed apply results." >> $GITHUB_STEP_SUMMARY

  comment-pr:
    name: 'Comment on PR'
    runs-on: ubuntu-latest
    needs: [determine-environment, build-lambda-layers, check-lambda-layer, terraform-validate-and-scan, deploy-base-infrastructure]
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment PR with Results
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## Base Infrastructure Plan - ${{ needs.determine-environment.outputs.environment }}
            
            Terraform plan generated and security scans completed.
            
            ### Summary:
            - **Environment:** ${{ needs.determine-environment.outputs.environment }}
            - **Infrastructure Type:** Base Infrastructure
            - **Dependencies:** Self-contained (creates backend resources)
            - **Lambda Layers:** ✅ Core, Financial, Crypto, and News dependencies layers
            - **Lambda Functions:** ✅ Backend application code included
            
            ### Infrastructure Components:
            - **KMS Keys:** ✅ Encryption keys for all services
            - **Cognito:** ✅ User authentication and authorization
            - **DynamoDB:** ✅ Data storage tables (including news table)
            - **CloudWatch:** ✅ Logging and monitoring
            - **Secrets Manager:** ✅ Secure credential storage (OAuth + NewsData)
            - **S3 Buckets:** ✅ Static hosting and file storage
            - **Lambda Layers:** ✅ Core, Financial, Crypto, and News dependencies
            - **Lambda Functions:** ✅ Stock data fetchers, news fetchers, and processors
            - **SQS Queues:** ✅ Message queuing for async processing
            - **EventBridge:** ✅ Scheduled triggers for data fetching
            
            ### Security Scans:
            - **Python SAST:** Bandit + Semgrep (Python)
            - **Python SCA:** pip-audit (dependencies)
            - **Secrets:** Gitleaks
            - **TFLint / Trivy / Terrascan:** (reusable workflow)  
            
            ### Next Steps:
            - Merge this PR to apply the infrastructure changes
            - Monitor the deployment in the Actions tab
            - Deploy application infrastructure after base is complete`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
